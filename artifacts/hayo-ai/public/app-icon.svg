<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/><stop offset="0.55" stop-color="#0c1a16"/><stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#243b4a" stroke-width="3" opacity="0.5"/>

  <!-- indicator glyphs (real math symbols) -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#7c8aa5" opacity="0.85">
    <text x="70" y="150" font-size="46">Σ</text>
    <text x="404" y="150" font-size="46">√</text>
    <text x="66" y="392" font-size="44">%</text>
    <text x="410" y="392" font-size="44">ƒ</text>
  </g>

  <!-- ═══ BRAIN ═══ -->
  <g filter="url(#glow)">
    <path d="M256 120
             C214 116 196 150 214 168
             C182 168 172 206 198 218
             C176 236 186 268 214 268
             C210 296 244 312 264 296
             C286 312 320 296 314 268
             C342 264 350 232 326 216
             C346 200 336 164 306 168
             C304 144 280 120 256 120 Z"
          fill="none" stroke="url(#brain)" stroke-width="11" stroke-linejoin="round"/>
    <!-- central fissure -->
    <path d="M256 122 C250 160 262 196 254 232 C250 258 260 280 258 296"
          fill="none" stroke="url(#brain)" stroke-width="7" opacity="0.85" stroke-linecap="round"/>
    <!-- gyri folds -->
    <g fill="none" stroke="url(#brain)" stroke-width="6" opacity="0.65" stroke-linecap="round">
      <path d="M226 156 C212 176 232 190 220 210"/>
      <path d="M212 232 C230 236 226 254 242 258"/>
      <path d="M286 156 C300 176 280 190 292 210"/>
      <path d="M300 232 C282 236 286 254 270 258"/>
    </g>
  </g>

  <!-- ═══ CANDLESTICKS + trend ═══ -->
  <g stroke-linecap="round">
    <line x1="180" y1="356" x2="180" y2="424" stroke="#0e9f6e" stroke-width="7"/>
    <rect x="165" y="372" width="30" height="40" rx="7" fill="#0e9f6e"/>
    <line x1="248" y1="330" x2="248" y2="416" stroke="#34d399" stroke-width="7"/>
    <rect x="233" y="348" width="30" height="52" rx="7" fill="#34d399"/>
    <line x1="316" y1="300" x2="316" y2="398" stroke="#34d399" stroke-width="7"/>
    <rect x="301" y="320" width="30" height="60" rx="7" fill="url(#up)"/>
  </g>
  <path d="M150 410 L248 356 L316 322 L360 340"
        fill="none" stroke="url(#up)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9"/>
</svg>
