name: Build HAYO AI Android APK

# Produces an installable APK you can download from the run's "Artifacts".
# Run manually from the Actions tab (Run workflow), or on changes to android-app/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: |
          set -o pipefail
          {
            echo "== env =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "JAVA_HOME=$JAVA_HOME"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
            echo "sdkmanager=$SDKM"
            echo "== accept licenses & install SDK 34 =="
            yes | "$SDKM" --licenses || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || echo "sdkmanager exit=$?"
            echo "== gradle =="
            command -v gradle && gradle --version
            echo "== build =="
            gradle :app:assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee build-log.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-app/build-log.txt
          if-no-files-found: ignore

      - name: Stage APK
        working-directory: android-app
        run: cp app/build/outputs/apk/debug/app-debug.apk HAYO-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAYO-AI-apk
          path: android-app/HAYO-AI.apk
          if-no-files-found: error
