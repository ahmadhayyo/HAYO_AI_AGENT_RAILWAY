name: Build HAYO AI Android APK

# Produces an installable APK you can download from the run's "Artifacts".
# Run manually from the Actions tab (Run workflow), or on changes to android-app/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_SDK_ROOT) and Gradle, so we
      # use them directly and keep ALL output in build-log.txt for diagnosability.
      - name: Build debug APK
        working-directory: android-app
        run: |
          set -o pipefail
          {
            echo "== env =="
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || echo sdkmanager)"
            echo "sdkmanager=$SDKM"
            echo "== installed platforms =="; ls "$SDK/platforms" 2>/dev/null || true
            echo "== ensure SDK 34 =="
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || echo "sdkmanager exit=$?"
            echo "== gradle version =="
            gradle --version || true
            echo "== generate wrapper (pin 8.7) =="
            gradle wrapper --gradle-version 8.7 --distribution-type bin 2>&1 | tail -5
            echo "== build =="
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee build-log.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-app/build-log.txt
          if-no-files-found: ignore

      - name: Stage APK
        working-directory: android-app
        run: cp app/build/outputs/apk/debug/app-debug.apk HAYO-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAYO-AI-apk
          path: android-app/HAYO-AI.apk
          if-no-files-found: error
