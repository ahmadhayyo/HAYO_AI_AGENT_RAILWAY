name: Build HAYO AI Android APK

# Produces an installable APK you can download from the run's "Artifacts".
# Run manually from the Actions tab (Run workflow), or on changes to android-app/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        working-directory: android-app
        run: cp app/build/outputs/apk/debug/app-debug.apk HAYO-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAYO-AI-apk
          path: android-app/HAYO-AI.apk
          if-no-files-found: error
