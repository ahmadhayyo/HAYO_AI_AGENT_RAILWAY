name: Build HAYO AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diag - after checkout
        run: |
          mkdir -p android-app
          echo "stage1: checkout OK ($(date))" > android-app/_diag.txt
          echo "runner: $RUNNER_OS $(uname -a)" >> android-app/_diag.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diag - after java
        run: echo "stage2: java OK -> $(java -version 2>&1 | head -1)" >> android-app/_diag.txt

      - name: Build debug APK
        working-directory: android-app
        run: |
          set +e
          echo "stage3: build step started" >> _diag.txt
          {
            echo "== env =="
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME"
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || echo sdkmanager)"
            echo "sdkmanager=$SDKM"; ls "$SDK/platforms" 2>/dev/null || true
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
            echo "== gradle =="; gradle --version 2>&1 | head -6
            echo "== wrapper =="; gradle wrapper --gradle-version 8.7 --distribution-type bin 2>&1 | tail -3
            echo "== assembleDebug =="; ./gradlew :app:assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee build-log.txt
          echo "stage4: build step ended rc=${PIPESTATUS[0]}" >> _diag.txt
          ls -la app/build/outputs/apk/debug/ >> _diag.txt 2>&1 || echo "no apk dir" >> _diag.txt

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: |
            android-app/_diag.txt
            android-app/build-log.txt
          if-no-files-found: warn

      - name: Publish APK
        working-directory: android-app
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk HAYO-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAYO-AI-apk
          path: android-app/HAYO-AI.apk
          if-no-files-found: error
